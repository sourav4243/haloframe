<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <h1>HaloFrame</h1>

    <label class="row">
        <span>Enabled</span>
        <input type="checkbox" id="enabled">
    </label>

    <label class="row">
        <span>Glass panels</span>
        <input type="checkbox" id="glass">
    </label>

    <hr>

    <div class="slider">
        <label for="farBlur">Glow softness<output id="farBlurVal"></output></label>
        <input type="range" id="farBlur" min="10" max="80" step="1">
    </div>
    <div class="slider">
        <label for="nearBlur">Edge detail<output id="nearBlurVal"></output></label>
        <input type="range" id="nearBlur" min="0" max="20" step="1">
    </div>
    <div class="slider">
        <label for="dim">Brightness<output id="dimVal"></output></label>
        <input type="range" id="dim" min="0.3" max="1" step="0.05">
    </div>
    <div class="slider">
        <label for="glassBlur">Glass frost<output id="glassBlurVal"></output></label>
        <input type="range" id="glassBlur" min="0" max="40" step="1">
    </div>
    <div class="slider">
        <label for="glassTint">Glaass darkness<output id="glassTintVal"></output></label>
        <input type="range" id="glassTint" min="0" max="0.8" step="0.05">
    </div>

    <button id="reset">Reset to defaults</button>

    <script src="../settings.js"></script>
    <script src="popup.js"></script>
</body>
</html>
